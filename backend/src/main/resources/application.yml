spring:
  application:
    name: docsearch-ai
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/docsearch}
    username: ${POSTGRES_USER:docsearch}
    password: ${POSTGRES_PASSWORD:docsearch-local}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  ai:
    retry:
      max-attempts: 1
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        model: ${OLLAMA_CHAT_MODEL:qwen3.5:9b}
        think: false
        keep-alive: 0s
        options:
          temperature: 0.0
          num-ctx: 8192
          num-predict: 512
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
        keep-alive: 0s
        truncate: false
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
docsearch:
  smoke:
    enabled: false
