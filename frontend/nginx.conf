server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 21m;
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
    }
    location / { try_files $uri $uri/ /index.html; }
}
